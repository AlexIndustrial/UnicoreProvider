plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id 'org.jetbrains.kotlin.jvm' version '1.9.22'
}

def mainClassName = "ru.unicorecms.unicoreprovider.UnicoreProviderModule";
sourceCompatibility = '21'
targetCompatibility = '21'

group 'uno.unicore'
version '1.0.1-STABLE'

repositories {
    mavenCentral()
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.9.3"
    implementation "org.jetbrains.kotlin:kotlin-stdlib"

    compileOnly 'com.google.code.gson:gson:2.9.0'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.17.2'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.17.2'
    compileOnly 'pro.gravit.launcher:launcher-core:5.6.9'
    compileOnly 'pro.gravit.launcher:launcher-ws-api:5.6.9'
    compileOnly 'pro.gravit.launcher:launchserver-api:5.6.9'
}

jar {
    manifest.attributes("Module-Main-Class": mainClassName)
}

shadowJar {
    archiveClassifier.set("")
}

artifacts {
    archives shadowJar
}